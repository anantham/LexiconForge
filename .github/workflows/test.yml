name: Test

# Contract: ADR docs/adr/CORE-013-ci-and-test-contract.md
# Five stable job names; each wraps exactly one npm run verify:* script.
# Job names are public contracts — renaming requires an ADR amendment.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: repository-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # exact-base two-tree diff needs full history
      - name: verify:integrity
        run: npm run verify:integrity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}

  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: verify:static
        run: npm run verify:static

  build-security:
    name: build-security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: verify:build-security
        run: npm run verify:build-security
        env:
          GEMINI_API_KEY: LF_SECRET_CANARY_GEMINI
          VITE_GEMINI_API_KEY: LF_SECRET_CANARY_VITE_GEMINI
          OPENAI_API_KEY: LF_SECRET_CANARY_OPENAI
          VITE_OPENAI_API_KEY: LF_SECRET_CANARY_VITE_OPENAI
          DEEPSEEK_API_KEY: LF_SECRET_CANARY_DEEPSEEK
          VITE_DEEPSEEK_API_KEY: LF_SECRET_CANARY_VITE_DEEPSEEK
          CLAUDE_API_KEY: LF_SECRET_CANARY_CLAUDE
          VITE_CLAUDE_API_KEY: LF_SECRET_CANARY_VITE_CLAUDE
          OPENROUTER_API_KEY: LF_SECRET_CANARY_OPENROUTER
          VITE_OPENROUTER_API_KEY: LF_SECRET_CANARY_VITE_OPENROUTER
          PIAPI_API_KEY: LF_SECRET_CANARY_PIAPI
          VITE_PIAPI_API_KEY: LF_SECRET_CANARY_VITE_PIAPI
          DEFAULT_OPENROUTER_KEY: LF_SECRET_CANARY_DEFAULT_TRIAL
          VITE_DEFAULT_OPENROUTER_KEY: LF_SECRET_CANARY_TRIAL
          VITE_GOOGLE_DRIVE_API_KEY: LF_SECRET_CANARY_GOOGLE_DRIVE
          # Scanner contract: without this list security:scan-client has zero
          # canaries to look for and reports success vacuously.
          LF_CLIENT_SECRET_CANARIES: LF_SECRET_CANARY_GEMINI,LF_SECRET_CANARY_VITE_GEMINI,LF_SECRET_CANARY_OPENAI,LF_SECRET_CANARY_VITE_OPENAI,LF_SECRET_CANARY_DEEPSEEK,LF_SECRET_CANARY_VITE_DEEPSEEK,LF_SECRET_CANARY_CLAUDE,LF_SECRET_CANARY_VITE_CLAUDE,LF_SECRET_CANARY_OPENROUTER,LF_SECRET_CANARY_VITE_OPENROUTER,LF_SECRET_CANARY_PIAPI,LF_SECRET_CANARY_VITE_PIAPI,LF_SECRET_CANARY_DEFAULT_TRIAL,LF_SECRET_CANARY_TRIAL,LF_SECRET_CANARY_GOOGLE_DRIVE

  unit-coverage:
    name: unit-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: verify:coverage-policy
        run: npm run verify:coverage-policy
      - name: verify:test
        run: npm run verify:test
        env:
          CI: 'true'
      - name: Upload coverage report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  domain-invariants:
    name: domain-invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: verify:invariants
        run: npm run verify:invariants
