<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IndexedDB Inspector</title>
  <style>
    body {
      font-family: 'Monaco', 'Courier New', monospace;
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    h1, h2 { color: #4ec9b0; }
    .stats-box {
      background: #252526;
      border: 1px solid #3e3e42;
      border-radius: 4px;
      padding: 20px;
      margin: 20px 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-size: 13px;
    }
    th {
      background: #2d2d30;
      padding: 10px;
      text-align: left;
      border-bottom: 2px solid #3e3e42;
      color: #4ec9b0;
    }
    td {
      padding: 8px 10px;
      border-bottom: 1px solid #3e3e42;
    }
    tr:hover { background: #2d2d30; }
    .number { text-align: right; }
    .checkmark { color: #4ec9b0; }
    button {
      background: #0e639c;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #1177bb; }
    .loading { color: #ce9178; }
    pre {
      background: #1e1e1e;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>📊 IndexedDB Inspector</h1>
  <button onclick="loadStats()">Refresh Statistics</button>

  <div id="loading" class="loading" style="display: none;">Loading...</div>
  <div id="results"></div>

  <script>
    const DB_NAME = 'LexiconForgeDB';
    const DB_VERSION = 9;

    async function loadStats() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('results').replaceChildren();

      try {
        const db = await openDB();
        const data = await collectData(db);
        db.close();

        displayResults(data);
      } catch (error) {
        displayError(error);
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve(request.result);
      });
    }

    async function collectData(db) {
      const tx = db.transaction(
        ['chapters', 'translations', 'generatedImages', 'audioFiles'],
        'readonly'
      );

      // Get all data
      const chapters = await getAll(tx.objectStore('chapters'));
      const translations = await getAll(tx.objectStore('translations'));
      const images = await getAll(tx.objectStore('generatedImages'));
      const audioFiles = await getAll(tx.objectStore('audioFiles'));

      // Build chapter stats
      const chapterStats = chapters.map(ch => {
        const chapterTranslations = translations.filter(t => t.stableId === ch.stableId);
        const activeTranslation = chapterTranslations.find(t => t.isActive);
        const chapterImages = images.filter(img => img.chapterId === ch.stableId);
        const chapterAudio = audioFiles.filter(a => a.chapterId === ch.stableId);

        return {
          stableId: ch.stableId,
          number: ch.chapterNumber || 0,
          title: ch.title || 'Untitled',
          translations: chapterTranslations.length,
          hasActive: !!activeTranslation,
          footnotes: activeTranslation?.footnotes?.length || 0,
          illustrations: activeTranslation?.suggestedIllustrations?.length || 0,
          images: chapterImages.length,
          imageSize: chapterImages.reduce((sum, img) => sum + (img.imageData?.length || 0), 0),
          audio: chapterAudio.length,
          audioSize: chapterAudio.reduce((sum, a) => sum + (a.audioData?.length || 0), 0),
        };
      });

      chapterStats.sort((a, b) => (a.number || 0) - (b.number || 0));

      // Totals
      const totals = {
        chapters: chapters.length,
        translations: translations.length,
        activeTranslations: translations.filter(t => t.isActive).length,
        images: images.length,
        totalImageSize: images.reduce((sum, img) => sum + (img.imageData?.length || 0), 0),
        audio: audioFiles.length,
        totalAudioSize: audioFiles.reduce((sum, a) => sum + (a.audioData?.length || 0), 0),
        totalFootnotes: translations.reduce((sum, t) => sum + (t.footnotes?.length || 0), 0),
        totalIllustrations: translations.reduce((sum, t) => sum + (t.suggestedIllustrations?.length || 0), 0),
      };

      return { chapterStats, totals };
    }

    function getAll(store) {
      return new Promise((resolve) => {
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      });
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function textElement(tag, value, className = '') {
      const element = document.createElement(tag);
      element.textContent = String(value ?? '');
      if (className) element.className = className;
      return element;
    }

    function statsBox(title) {
      const box = document.createElement('div');
      box.className = 'stats-box';
      box.append(textElement('h2', title));
      return box;
    }

    function displayError(error) {
      const box = statsBox('❌ Error');
      box.append(textElement('pre', error?.message ?? 'Unable to inspect database'));
      document.getElementById('results').replaceChildren(box);
    }

    function appendTable(box, rows, headers = null) {
      const table = document.createElement('table');
      if (headers) {
        const head = document.createElement('thead');
        const row = document.createElement('tr');
        headers.forEach(label => row.append(textElement('th', label)));
        head.append(row);
        table.append(head);
      }
      const body = document.createElement('tbody');
      rows.forEach(values => {
        const row = document.createElement('tr');
        values.forEach((value, index) => row.append(textElement('td', value,
          headers ? (index !== 2 && index !== 9 ? 'number' : '') : (index === 1 ? 'number' : ''))));
        body.append(row);
      });
      table.append(body);
      box.append(table);
    }

    function displayResults(data) {
      const { chapterStats, totals } = data;
      const overview = statsBox('📈 Database Overview');
      appendTable(overview, [
        ['Chapters', totals.chapters],
        ['Translations', `${totals.translations} (${totals.activeTranslations} active)`],
        ['Footnotes', totals.totalFootnotes],
        ['Illustrations', totals.totalIllustrations],
        ['Generated Images', `${totals.images} (${formatBytes(totals.totalImageSize)})`],
        ['Audio Files', `${totals.audio} (${formatBytes(totals.totalAudioSize)})`],
      ]);

      const chapters = statsBox('📚 Chapter Details');
      appendTable(chapters, chapterStats.map(ch => [
        ch.number, ch.translations, ch.hasActive ? '✓' : '', ch.footnotes,
        ch.illustrations, ch.images, formatBytes(ch.imageSize), ch.audio,
        formatBytes(ch.audioSize), ch.title,
      ]), ['#', 'Versions', 'Active', 'Footnotes', 'Illustrations', 'Images',
        'Image Size', 'Audio', 'Audio Size', 'Title']);

      const summary = statsBox('📊 Summary Statistics');
      const countLabel = predicate => {
        const count = chapterStats.filter(predicate).length;
        const percent = totals.chapters ? (count / totals.chapters) * 100 : 0;
        return `${count}/${totals.chapters} (${percent.toFixed(1)}%)`;
      };
      const average = total => (totals.chapters ? total / totals.chapters : 0).toFixed(1);
      appendTable(summary, [
        ['Chapters with translations', countLabel(ch => ch.translations > 0)],
        ['Chapters with footnotes', countLabel(ch => ch.footnotes > 0)],
        ['Chapters with illustrations', countLabel(ch => ch.illustrations > 0)],
        ['Chapters with images', countLabel(ch => ch.images > 0)],
        ['Average footnotes/chapter', average(totals.totalFootnotes)],
        ['Average illustrations/chapter', average(totals.totalIllustrations)],
        ['Average images/chapter', average(totals.images)],
        ['Average image size', totals.images ? formatBytes(totals.totalImageSize / totals.images) : '0 B'],
      ]);
      document.getElementById('results').replaceChildren(overview, chapters, summary);
    }

    // Auto-load on page load
    window.addEventListener('DOMContentLoaded', loadStats);
  </script>
</body>
</html>
